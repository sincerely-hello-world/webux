root = "."
tmp_dir = ".air"

[build]
  # 与发布产物保持一致: 默认编入 mysql + postgres 驱动 (见 .goreleaser.yaml 的
  # builds.tags)。不加时 mysql_stub.go (//go:build !mysql) 会让 connectMySQL 返回
  # ErrDriverNotCompiled —— dev 下能探测实例但无法执行查询, 与线上行为不符。
  cmd = 'go build -tags "mysql postgres" -o .air/webux ./cmd/webux'
  # 二进制与启动参数写在同一条 entrypoint 里 (air 1.62+ 的写法)。
  # 旧的 `bin` + `args_bin` 组合仍能用, 但 air 每次启动都会打印弃用警告, 故不再使用。
  # 首元素按 root 解析, air 会自行转成绝对路径。
  #
  #   --config /dev/null  空文件 -> yaml.Unmarshal 不覆盖任何字段,
  #                       internal/config.defaults() 生效, 于是监听 :8989
  #                       (scripts/config.yaml 在 dev 下**不生效**)
  #   --no-auth           关闭鉴权
  #
  # data_dir 由 mise 的 dev / dev-backend 任务通过 WEBUX_DATA_DIR 注入 /tmp/webux-data。
  entrypoint = [".air/webux", "--config", "/dev/null", "--no-auth"]
  include_ext = ["go"]
  exclude_dir = ["web", ".air", "build"]
  delay = 500

[log]
  time = false

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"

[misc]
  clean_on_exit = true
